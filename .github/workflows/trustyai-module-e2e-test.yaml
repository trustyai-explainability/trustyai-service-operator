name: Tier 2 - Operators (workload, module) smoke tests

on:
  pull_request:
    paths:
      - 'config/**'
      - 'controllers/**'
      - 'pkg/**'
      - 'Dockerfile'
      - 'trustyai-operator-module/**'
      - 'tests/crds/**'
      - 'tests/smoke/**'
      - 'Makefile.trustyai-operator-module.mk'
      - 'Makefile'
      - '.github/workflows/trustyai-module-e2e-test.yaml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      TRUSTYAI_OPERATOR_IMG: smoke/operator
      WORKLOAD_TAG: pr-${{ github.event.pull_request.number || 'default-pr-number' }}
      TRUSTYAI_MODULE_IMG: trustyai-operator-module-controller
      MODULE_TAG: pr-${{ github.event.pull_request.number || 'default-pr-number' }}
      PR_NUMBER: ${{ github.event.pull_request.number || 'default-pr-number' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: trustyai-operator-module/go.mod
          cache-dependency-path: trustyai-operator-module/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the workload operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.TRUSTYAI_OPERATOR_IMG }}:${{ env.WORKLOAD_TAG }}
          build-args: |
            CI_CONTAINER_VERSION=${{ env.WORKLOAD_TAG }}

      - name: Build the module operator image
        uses: docker/build-push-action@v6
        with:
          context: trustyai-operator-module
          file: trustyai-operator-module/Dockerfile
          load: true
          tags: ${{ env.TRUSTYAI_MODULE_IMG }}:${{ env.MODULE_TAG }}
          build-args: |
            VERSION=${{ env.MODULE_TAG }}

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.29.0
          cluster_name: kind

      - name: Load both operator images into Kind
        run: |
          kind load docker-image ${{ env.TRUSTYAI_OPERATOR_IMG }}:${{ env.WORKLOAD_TAG }}
          kind load docker-image ${{ env.TRUSTYAI_MODULE_IMG }}:${{ env.MODULE_TAG }}

      - name: Apply external CRDs required by both operators
        run: |
          kubectl apply -f tests/crds/monitoring.coreos.com_prometheuses.yaml
          kubectl apply -f tests/crds/monitoring.coreos.com_servicemonitors.yaml
          kubectl apply -f tests/crds/route_crd.yaml
          kubectl apply -f tests/crds/serving.kserve.io_inferenceservices.yaml

      - name: Deploy the module operator
        run: |
          kubectl create namespace system
          make deploy-tom TRUSTYAI_MODULE_IMG=${{ env.TRUSTYAI_MODULE_IMG }} MODULE_TAG=${{ env.MODULE_TAG }}
          kubectl set env deployment/trustyai-operator-module-controller-manager -n system \
            RELATED_IMAGE_ODH_TRUSTYAI_SERVICE_OPERATOR_IMAGE=${{ env.TRUSTYAI_OPERATOR_IMG }}:${{ env.WORKLOAD_TAG }}

      - name: Wait for the module operator
        run: |
          if ! kubectl wait --for=condition=available --timeout=120s \
            deployment/trustyai-operator-module-controller-manager -n system; then
            echo "::group::Module operator diagnostics"
            kubectl get pods -n system -o wide
            kubectl describe pod -l control-plane=controller-manager -n system
            kubectl logs -l control-plane=controller-manager -n system --tail=200 || true
            kubectl get events -n system --sort-by='.lastTimestamp' || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Deploy the TrustyAI module resource
        run: kubectl apply -f trustyai-operator-module/tests/e2e/manifests/trustyai-cr.yaml

      - name: Wait for the module to deploy the workload operator
        run: |
          kubectl wait --for=condition=available --timeout=180s \
            deployment/trustyai-service-operator-controller-manager -n system

      - name: Run workload operator smoke tests
        run: ./tests/smoke/test_smoke.sh

      - name: Run module operator e2e tests
        run: make test-tom-e2e

      - name: Collect diagnostics
        if: always()
        run: |
          echo "::group::TrustyAI module CR"
          kubectl get trustyai.components.platform.opendatahub.io -o yaml || true
          echo "::endgroup::"
          echo "::group::system namespace resources"
          kubectl get all -n system || true
          echo "::endgroup::"
          echo "::group::Module operator logs"
          kubectl logs -l control-plane=controller-manager -n system --tail=500 || true
          echo "::endgroup::"
          echo "::group::Workload operator logs"
          kubectl logs -l control-plane=trustyai-service-operator -n system --tail=500 || true
          echo "::endgroup::"
