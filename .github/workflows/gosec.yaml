---
name: Tier 1 - Gosec security scan

on:
  pull_request:
    branches: [main, incubation, stable]

jobs:
  gosec:
    name: Gosec Security Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"

      # No -no-fail: gosec exits non-zero on any finding, so this step is a real
      # merge gate. The SARIF file is written before the exit status is reported,
      # so results still reach the Security tab when the gate fails. A finding is
      # either fixed or annotated in place with a `#nosec <RULE> -- <reason>`
      # directive that records why it is a false positive or an accepted risk.
      - name: Run Gosec Security Scanner
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'

      - name: Upload SARIF file to GitHub Security tab
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always()
        with:
          sarif_file: gosec-results.sarif
          category: "gosec-security-scan"

      - name: Upload Gosec results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gosec-results
          path: gosec-results.sarif
