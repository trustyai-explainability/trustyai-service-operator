name: Tier 1 - Controller tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Retain legacy coverage and exercise DRA Pods on the GA baseline.
        envtest-k8s-version: ["1.29.0", "1.34.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"

      - name: Test
        run: make test ENVTEST_K8S_VERSION=${{ matrix.envtest-k8s-version }}
