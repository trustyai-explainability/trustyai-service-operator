kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    deployment.kubernetes.io/revision: '1'
  name: {{ .Instance.Name }}
  namespace: {{ .Instance.Namespace }}
  labels:
    app: {{ .Instance.Name }}
    app.kubernetes.io/instance: {{ .Instance.Name }}
    app.kubernetes.io/name: {{ .Instance.Name }}
    app.kubernetes.io/part-of: trustyai
    app.kubernetes.io/version: {{ .Version }}
spec:
  {{ if .Instance.IsMigration }}
  progressDeadlineSeconds: 2100
  {{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Instance.Name }}
      app.kubernetes.io/instance: {{ .Instance.Name }}
      app.kubernetes.io/name: {{ .Instance.Name }}
      app.kubernetes.io/part-of: trustyai
      app.kubernetes.io/version: {{ .Version }}
  template:
    metadata:
      labels:
        app: {{ .Instance.Name }}
        app.kubernetes.io/instance: {{ .Instance.Name }}
        app.kubernetes.io/name: {{ .Instance.Name }}
        app.kubernetes.io/part-of: trustyai
        app.kubernetes.io/version: {{ .Version }}
      annotations:
        prometheus.io/path: /q/metrics
        prometheus.io/scheme: http
        prometheus.io/scrape: 'true'
    spec:
      serviceAccountName: {{ .Instance.Name }}-proxy
      containers:
        - name: trustyai-service
          image: {{ .ServiceImage }}
          env:
            # Sidecars terminate Service TLS (8443/4443). The Python image only
            # honors insecure_bind (127.0.0.1:HTTP_PORT) when cert files exist;
            # without them Hypercorn falls back to 127.0.0.1:8000 and kubelet
            # probes on :8080 CrashLoop the container. Mount the internal
            # Service cert and bind native HTTPS on an unused port so HTTP_PORT
            # stays reachable for the proxies.
            - name: TLS_POLICY
              value: system
            - name: TLS_REQUIRED
              value: "false"
            - name: TLS_CERT_FILE
              value: /etc/tls/internal/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/tls/internal/tls.key
            - name: HTTP_PORT
              value: "8081"
            - name: SSL_PORT
              value: "8444"
            - name: HEALTH_PORT
              value: "8080"
            - name: SERVICE_STORAGE_FORMAT
              value: {{ .Instance.Spec.Storage.Format }}
            {{ if eq .Instance.Spec.Storage.Format "PVC" }}
            - name: STORAGE_DATA_FILENAME
              value: {{ .Instance.Spec.Data.Filename }}
            - name: STORAGE_DATA_FOLDER
              value: {{ .Instance.Spec.Storage.Folder }}
            - name: SERVICE_DATA_FORMAT
              value: {{ .Instance.Spec.Data.Format }}
            - name: QUARKUS_HIBERNATE_ORM_ACTIVE
              value: false
            {{ end }}
            {{ if .Instance.IsMigration }}
            - name: STORAGE_DATA_FILENAME
              value: {{ .Instance.Spec.Data.Filename }}
            - name: STORAGE_DATA_FOLDER
              value: {{ .Instance.Spec.Storage.Folder }}
            - name: SERVICE_DATA_FORMAT
              value: {{ .Instance.Spec.Data.Format }}
            - name: {{ .MigrationEnvVarName }}
              value: "true"
            {{ end }}
            {{ if eq .Instance.Spec.Storage.Format "DATABASE" }}
            - name: QUARKUS_HIBERNATE_ORM_ACTIVE
              value: true
            - name: QUARKUS_DATASOURCE_DB_KIND
              valueFrom:
                secretKeyRef:
                  name: {{ .Instance.Spec.Storage.DatabaseConfigurations }}
                  key: databaseKind
            - name: QUARKUS_DATASOURCE_JDBC_MAX_SIZE
              value: 16
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Instance.Spec.Storage.DatabaseConfigurations }}
                  key: databaseUsername
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Instance.Spec.Storage.DatabaseConfigurations }}
                  key: databasePassword
            - name: DATABASE_SERVICE
              valueFrom:
                secretKeyRef:
                  name: {{ .Instance.Spec.Storage.DatabaseConfigurations }}
                  key: databaseService
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Instance.Spec.Storage.DatabaseConfigurations }}
                  key: databasePort
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Instance.Spec.Storage.DatabaseConfigurations }}
                  key: databaseName
            - name: QUARKUS_DATASOURCE_JDBC_URL
            {{ if .UseDBTLSCerts }}
              value: "jdbc:${QUARKUS_DATASOURCE_DB_KIND}://${DATABASE_SERVICE}:${DATABASE_PORT}/${DATABASE_NAME}?requireSSL=true&sslMode=verify-ca&serverSslCert=/etc/tls/db/ca.crt"
            {{ else }}
              value: "jdbc:${QUARKUS_DATASOURCE_DB_KIND}://${DATABASE_SERVICE}:${DATABASE_PORT}/${DATABASE_NAME}"
            {{ end }}
            - name: SERVICE_DATA_FORMAT
              value: "HIBERNATE"
            - name: QUARKUS_DATASOURCE_GENERATION
              valueFrom:
                secretKeyRef:
                  name: {{ .Instance.Spec.Storage.DatabaseConfigurations }}
                  key: databaseGeneration
            {{ end }}
            - name: SERVICE_METRICS_SCHEDULE
              value: "{{ .Schedule }}"
            - name: SERVICE_BATCH_SIZE
              value: {{ .BatchSize }}
            {{ if .Instance.IsMigration }}
            - name: STORAGE_MIGRATION_CONFIG_FROM_FOLDER
              value: {{ .Instance.Spec.Storage.Folder }}
            - name: STORAGE_MIGRATION_CONFIG_FROM_FILENAME
              value: {{ .Instance.Spec.Data.Filename }}
            {{ end }}
          {{ if .Instance.IsMigration }}
          # Allow up to 30 minutes for migration before liveness takes over.
          # Exec against loopback HTTP_PORT: the app binds 127.0.0.1 only.
          startupProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:8081/q/health/live"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 180
          {{ end }}
          # HTTP is loopback-only (kube-rbac-proxy upstream); kubelet httpGet
          # to the pod IP cannot reach it. Probe via exec on 127.0.0.1:8081.
          readinessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:8081/q/health/ready"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:8081/q/health/live"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - name: {{ .Instance.Name }}-internal
              mountPath: /etc/tls/internal
              readOnly: true
            {{ if or (eq .Instance.Spec.Storage.Format "PVC") (.Instance.IsMigration) }}
            - name: {{ .VolumeMountName }}
              mountPath: {{ .Instance.Spec.Storage.Folder }}
              readOnly: false
            {{ end }}
            {{ if .UseDBTLSCerts }}
            - name: db-ca-cert
              mountPath: /etc/tls/db
              readOnly: true
            {{ end }}
        - name: kube-rbac-proxy
          image: {{ .KubeRBACProxyImage }}
          args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8081/
            - --config-file=/etc/kube-rbac-proxy/config.yaml
{{- range .ProxyTLSArgs }}
            - {{ . }}
{{- end }}
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --proxy-endpoints-port=9443
            - --v=0
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 9443
              name: proxy-healthz
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: {{ .Instance.Name }}-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: kube-rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            {{ if .CustomCertificatesBundle.IsDefined }}
            - name: {{ .CustomCertificatesBundle.VolumeName }}
              readOnly: true
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: ca-bundle.crt
            {{ end }}
        # Internal KServe HTTPS preserves the unauthenticated consumer contract,
        # not access to the main API. All other paths retain proxy authorization.
        - name: internal-tls-proxy
          image: {{ .KubeRBACProxyImage }}
          args:
            - --secure-listen-address=0.0.0.0:4443
            # Same loopback HTTP listener as kube-rbac-proxy; the Python image
            # no longer serves a separate health app on :8080.
            - --upstream=http://127.0.0.1:8081/
            - --config-file=/etc/kube-rbac-proxy/config.yaml
            - --ignore-paths=/,/consumer/kserve/v2,/q/health/live,/q/health/ready
{{- range .ProxyTLSArgs }}
            - {{ . }}
{{- end }}
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --v=0
          ports:
            - containerPort: 4443
              name: internal-https
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 4443
              scheme: HTTPS
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 4443
              scheme: HTTPS
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: {{ .Instance.Name }}-internal
              mountPath: /etc/tls/private
              readOnly: true
            - name: kube-rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
      serviceAccount: {{ .Instance.Name }}-proxy
      volumes:
        {{ if or (eq .Instance.Spec.Storage.Format "PVC") ( .Instance.IsMigration) }}
        - name: volume
          persistentVolumeClaim:
            claimName: {{ .PVCClaimName }}
        {{ end }}
        {{ if .CustomCertificatesBundle.IsDefined }}
        - name: {{ .CustomCertificatesBundle.VolumeName}}
          configMap:
            name: {{ .CustomCertificatesBundle.ConfigMapName }}
            defaultMode: 420
        {{ end }}
        - name: {{ .Instance.Name}}-tls
          secret:
            secretName: {{ .Instance.Name }}-tls
            defaultMode: 420
        - name: {{ .Instance.Name}}-internal
          secret:
            secretName: {{ .Instance.Name }}-internal
            defaultMode: 420
        - name: kube-rbac-proxy-config
          configMap:
            name: {{ .Instance.Name }}-kube-rbac-proxy-config
            defaultMode: 420
        {{ if .UseDBTLSCerts }}
        - name: db-ca-cert
          secret:
            secretName: {{ .Instance.Name }}-db-ca
            defaultMode: 420
        {{ end }}
