apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: {{ .ServiceName }}
    namespace: {{ .Namespace }}
    labels:
        modelmesh-service: modelmesh-serving
spec:
    endpoints:
        - bearerTokenSecret:
              name: {{ .TokenSecretName }}
              key: token
          honorLabels: true
          interval: 4s
          metricRelabelings:
              - action: keep
                regex: trustyai_.*
                sourceLabels:
                    - __name__
          params:
              'match[]':
                  - '{__name__= "trustyai_spd"}'
                  - '{__name__= "trustyai_dir"}'
          path: /q/metrics
          port: https
          scheme: https
          tlsConfig:
              ca:
                  configMap:
                      name: {{ .CABundleConfigMapName }}
                      key: service-ca.crt
              serverName: {{ .ServiceName }}-tls.{{ .Namespace }}.svc
    namespaceSelector:
        matchNames:
            - {{ .Namespace }}
    selector:
        matchLabels:
            app.kubernetes.io/part-of: {{ .ComponentName }}
            trustyai-service-name: {{ .ServiceName }}
