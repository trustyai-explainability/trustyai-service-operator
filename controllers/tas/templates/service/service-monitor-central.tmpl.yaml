apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    labels:
        modelmesh-service: modelmesh-serving
    name: {{ .ServiceName }}
    namespace: {{ .Namespace }}
spec:
    endpoints:
        - bearerTokenSecret:
              key: ''
          honorLabels: true
          interval: 4s
          metricRelabelings:
              - action: keep
                regex: trustyai_.*
                sourceLabels:
                    - __name__
          params:
              'match[]':
                  - '{__name__= "trustyai_spd"}'
                  - '{__name__= "trustyai_dir"}'
          path: /q/metrics
          port: direct-https
          scheme: https
          # insecureSkipVerify is required here because this ServiceMonitor scrapes
          # TrustyAI services across all namespaces, so there is no single static
          # serverName that matches the service-CA-issued cert SAN
          # (<service>.<namespace>.svc) for every target.  The local ServiceMonitor
          # (one per TrustyAI instance) uses proper CA + serverName validation instead.
          tlsConfig:
              insecureSkipVerify: true
    namespaceSelector:
        any: true
    selector:
        matchLabels:
            app.kubernetes.io/part-of: {{ .ComponentName }}
