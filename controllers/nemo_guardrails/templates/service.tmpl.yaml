apiVersion: v1
kind: Service
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    app: {{.SelectorName}}
    component: {{.SelectorName}}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{.WorkloadName}}-tls
spec:
  ipFamilies:
    - IPv4
  ports:
    {{if .UseAuthProxy }}
    - name: {{ .PortName }}
      protocol: TCP
      port: 443
      targetPort: 8443
    - name: {{ .AdminPortName }}
      protocol: TCP
      port: 444
      targetPort: 8444
    {{else}}
    - name: {{ .PortName }}
      protocol: TCP
      port: 80
      targetPort: 8000
    {{end}}
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: {{.SelectorName}}
    component: {{.SelectorName}}
