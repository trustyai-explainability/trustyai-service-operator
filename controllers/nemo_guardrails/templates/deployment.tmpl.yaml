apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.WorkloadName}}
  namespace: {{.Namespace}}
  labels:
    app: {{.WorkloadName}}
    component: {{.WorkloadName}}
    deploy-name: {{.WorkloadName}}
    app.kubernetes.io/instance: {{.WorkloadName}}
    app.kubernetes.io/name: {{.WorkloadName}}
    app.kubernetes.io/part-of: trustyai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.WorkloadName}}
  template:
    metadata:
      labels:
        app: {{.WorkloadName}}
        component: {{.WorkloadName}}
        deploy-name: {{.WorkloadName}}
        app.kubernetes.io/instance: {{.WorkloadName}}
        app.kubernetes.io/name: {{.WorkloadName}}
        app.kubernetes.io/part-of: trustyai
    spec:
      containers:
      - name: nemo-guardrails
        image: {{.ContainerImages.NemoGuardrailsImage}}
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 12
        ports:
        - containerPort: 8000
      {{ if .UseAuthProxy }}
      - {{- template "kubeRBACProxy" .KubeRbacProxyConfig }}
      - {{- template "kubeRBACProxyAdmin" .KubeRbacProxyAdminConfig }}
      serviceAccountName: {{.ServiceAccountName}}
      {{ end }}
      volumes:
      - name: tls-certs
        secret:
          secretName: {{.WorkloadName}}-tls
          defaultMode: 420
      {{ if .UseAuthProxy }}
      - name: kube-rbac-config
        configMap:
          name: {{ .KubeRbacProxyConfig.Name }}
          defaultMode: 420
      - name: kube-rbac-config-admin
        configMap:
          name: {{ .KubeRbacProxyAdminConfig.Name }}
          defaultMode: 420
      {{ end }}