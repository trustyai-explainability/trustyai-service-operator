{{ define "kubeRBACProxy" }} name: kube-rbac-proxy
        image: {{ .KubeRBACProxyImage}}
        args:
          - --secure-listen-address=0.0.0.0:{{ .DownstreamPort }}
          - --upstream={{ .UpstreamProtocol }}://{{ .UpstreamHost }}:{{ .UpstreamPort }}/
          - --config-file=/etc/kube-rbac-proxy/config.yaml
          - --tls-cert-file=/etc/tls/private/tls.crt
          - --tls-private-key-file=/etc/tls/private/tls.key
          - --upstream-ca-file=/etc/ssl/certs/ca-certificates.crt
          - --proxy-endpoints-port={{ .HealthPort }}
          - --allow-paths=/v1/*,/v1/*/*
          - --v=0
        ports:
          - containerPort: {{ .DownstreamPort }}
            name: https
            protocol: TCP
          - containerPort: {{ .HealthPort }}
            name: proxy-healthz
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .HealthPort }}
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .HealthPort }}
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
          - name: tls-certs
            mountPath: /etc/tls/private
            readOnly: true
          - name: kube-rbac-config
            mountPath: /etc/kube-rbac-proxy
            readOnly: true
{{ end }}

