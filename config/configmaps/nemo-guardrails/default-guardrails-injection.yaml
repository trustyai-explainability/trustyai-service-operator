apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-guardrails-default-injection
  labels:
    nemo-guardrails-config: "true"
  annotations:
    "guardrail-tags": |
      ["prompt-injection", "jailbreak"]
    "evalhub/results": |
      [
        {
          "provider": "nemo-guardrails",
          "benchmark_id": "prompt_injection",
          "benchmark_source": "https://github.com/eval-hub/eval-hub-contrib/blob/a1f02d02a8f1f839a95c05561f13cb25299c8437/adapters/nemo-guardrails/provider.yaml#L21",
          "metrics": {
            "accuracy": 0.8901,
            "allowed_f1": 0.8846,
            "allowed_precision": 0.8081,
            "allowed_recall": 0.9772,
            "blocked_f1": 0.895,
            "blocked_precision": 0.9794,
            "blocked_recall": 0.824,
            "errors": 1,
            "mean_latency_ms": 93.9,
            "median_latency_ms": 54.1,
            "p95_latency_ms": 232
          },
          "artifacts": {
            "evalhub.env_card": {
              "aggregate_results": {},
              "autograder_bias": {},
              "capture_completeness": 0.15,
              "confidence_intervals": {},
              "cpu_model": "arm",
              "custom": {},
              "k8s_pod_labels": {},
              "k8s_resource_limits": {},
              "key_packages": {
                "torch": "2.13.0",
                "transformers": "5.14.1"
              },
              "os_info": "macOS-26.6.2-arm64-arm-64bit",
              "per_task_results": {},
              "python_version": "3.12.7",
              "scorer_ids": []
            }
          }
        }
      ]
data:
  config.yaml: |
    passthrough: true
    rails:
      input:
        flows:
          - injection detection
          - hf classifier check windowed input $classifier="prompt-injection"
      config:
        injection_detection:
          injections:
            - code
            - sqli
            - template
            - xss
        hf_classifier:
          prompt-injection:
            engine: local
            model: "RedHatAI/deberta-v3-base-prompt-injection-v2"
            task: text-classification
            threshold: 0.5
            blocked_labels:
              - "INJECTION"
  rails.co: |
    define flow hf classifier check windowed input
      $result = execute hf_classifier_check_input_windowed(classifier=$classifier)
      if $result.is_blocked
        bot refuse to respond
        stop

    define flow hf classifier check windowed output
      $result = execute hf_classifier_check_output_windowed(classifier=$classifier)
      if $result.is_blocked
        bot refuse to respond
        stop

  actions.py: |
    from typing import Any, Optional

    from nemoguardrails.actions import action
    from nemoguardrails.actions.rail_outcome import RailOutcome
    from nemoguardrails.http import HTTPClient
    from nemoguardrails.library.hf_classifier.actions import _classify_and_check, hf_classifier_check_input, \
    hf_classifier_check_output
    from torch import AcceleratorError

    def _sliding_windows(text: str, window_size: int, overlap: int) -> list[str]:
        if len(text) <= window_size:
            return [text]
        windows = []
        step = window_size - overlap
        start = 0
        while start < len(text):
            windows.append(text[start: start + window_size])
            if start + window_size >= len(text):
                break
            start += step
        return windows


    @action()
    async def hf_classifier_check_input_windowed(
            classifier: str,
            config: Any | None = None,
            context: Optional[dict] = None,
            text: Optional[str] = None,
            http_client: HTTPClient | None = None,
            window_size: int = 2500,
            overlap: int = 500,
            **kwargs,
    ) -> RailOutcome:
        if text is None:
            text = (context.get("user_message") or "") if context else ""

        retries = 0
        while True:
            try:
                windows = _sliding_windows(text, window_size, overlap)
                for i, window in enumerate(windows):
                    result = await hf_classifier_check_input(classifier, config, context, text=window,
                                                             http_client=http_client, **kwargs)
                    if result != RailOutcome.allow():
                        return result

                return RailOutcome.allow()
            except AcceleratorError as e:
                if retries >= 3:
                    raise e
                window_size = window_size // 2
                overlap = overlap // 2
                retries += 1


    @action()
    async def hf_classifier_check_output_windowed(
            classifier: str,
            config: Any | None = None,
            context: Optional[dict] = None,
            text: Optional[str] = None,
            http_client: HTTPClient | None = None,
            window_size: int = 2500,
            overlap: int = 500,
            **kwargs,
    ) -> RailOutcome:
        if text is None:
            text = (context.get("bot_message") or "") if context else ""

        retries = 0
        while True:
            try:
                windows = _sliding_windows(text, window_size, overlap)
                for i, window in enumerate(windows):
                    result = await hf_classifier_check_input(classifier, config, None, text=window, http_client=http_client,
                                                             **kwargs)
                    if result != RailOutcome.allow():
                        return result

                return RailOutcome.allow()
            except AcceleratorError as e:
                if retries >= 3:
                    raise e
                window_size = window_size // 2
                overlap = overlap // 2
                retries += 1
