# The controller updates finalizers on multi-tenant CRs, including during deletion.
# It must pass admission without granting this bypass to project identities.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: evalhub-multitenancy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: evalhub-multitenancy-manager
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: system
