---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NeMo Guardrails Only Overlay
# Deploys only the NeMo Guardrails controller

resources:
  - ../../base

components:
  - ../../components/nemo-guardrails

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: trustyai

namePrefix: trustyai-service-operator-

configMapGenerator:
  - env: params.env
    behavior: merge
    name: config
