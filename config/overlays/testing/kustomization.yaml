resources:
  - ../../base

components:
  - ../../components/webhook
  - ../../components/tas
  - ../../components/evalhub
  - ../../components/lmes
  - ../../components/nemo-guardrails

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: trustyai

namePrefix: trustyai-service-operator-

patches:
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--enable-services"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "TAS,LMES,NEMO_GUARDRAILS,EVALHUB"

patchesStrategicMerge:
  - image-pull-policy.yaml
