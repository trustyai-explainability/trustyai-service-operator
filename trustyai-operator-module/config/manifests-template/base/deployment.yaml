apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustyai-service-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: trustyai-service-operator
  template:
    metadata:
      labels:
        control-plane: trustyai-service-operator
    spec:
      serviceAccountName: trustyai-service-operator
      containers:
      - name: manager
        # Image is injected by the overlay via replacements from params.env
        image: trustyai-service-operator
        envFrom:
        - configMapRef:
            # ConfigMap created by the overlay configMapGenerator from params.env;
            # provides RELATED_IMAGE_* refs the operator needs for sub-component pods.
            name: trustyai-images
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          # Auto-populated by OpenShift's service-CA operator via the
          # webhook-service Service's serving-cert-secret-name annotation.
          secretName: webhook-server-cert
