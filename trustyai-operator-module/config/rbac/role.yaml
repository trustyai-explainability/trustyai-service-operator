apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  - apiGroups:
      - components.platform.opendatahub.io
    resources:
      - trustyais
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - components.platform.opendatahub.io
    resources:
      - trustyais/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - components.platform.opendatahub.io
    resources:
      - trustyais/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
